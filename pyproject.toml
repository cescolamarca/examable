[project]
name = "examable"
version = "1.0.0"
description = "Turns past-exam PDFs into a deduplicated question bank with practice simulations and spaced repetition."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "B008",   # FastAPI declares dependencies and File()/Form() parameters as defaults.
  "RUF001", # Italian text legitimately contains ambiguous-looking unicode characters.
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"] # scripts add the project root to sys.path before importing app

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  # Raised by fastapi.testclient itself with recent Starlette releases.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*", "app/templates/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
