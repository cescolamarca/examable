services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: examable
      POSTGRES_USER: examable
      POSTGRES_PASSWORD: examable
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examable -d examable"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://examable:examable@db:5432/examable
      UPLOAD_DIR: /data/uploads
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
