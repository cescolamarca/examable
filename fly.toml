app = "examable-3iqwtm"
primary_region = "fra"

# Secrets (set with `fly secrets set ...`): DATABASE_URL, ADMIN_TOKEN, MULTIMODAL_API_KEY.

[env]
  UPLOAD_DIR = "/data/uploads"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[mounts]
  source = "examable_data"
  destination = "/data"
